[toolchain]
# Match the repo package manager (pnpm-lock.yaml at root); avoids Anchor's yarn default.
package_manager = "pnpm"
solana_version = "3.1.8"

[features]
resolution = true
skip-lint = false

[programs.localnet]
create_token = "GwvQ53QTu1xz3XXYfG5m5jEqwhMBvVBudPS8TUuFYnhT"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# The LiteSVM test loads Metaplex Token Metadata from a local fixture
# (tests/fixtures/mpl_token_metadata.so) instead of cloning it from mainnet,
# which is too slow and unreliable in CI.
test = "cargo test"
