[package]
name = "external-delegate-token-master"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "external_delegate_token_master"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "2.0.0-rc.1"
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.5", features = ["derive"] }
# anchor-lang 2.0.0-rc.1 is built against wincode 0.5, but solana-address 2.7
# moved to wincode 0.6. With both in the graph, `Address`'s wincode impls
# belong to the version the account derives are not using and every
# `SchemaRead`/`SchemaWrite` bound fails. 2.6.1 is the last 0.5-line release.
solana-address = ">=2.6, <2.7"
anchor-spl = { version = "2.0.0-rc.1", features = ["metadata"] }
sha3 = "0.10.8"
solana-secp256k1-recover = "2.0.0"

[dev-dependencies]
# Signs test transfer authorizations with a fixed secp256k1 key so tests can
# exercise the Ethereum-signature path end to end.
libsecp256k1 = "0.7.2"
litesvm = "0.13.1"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-kite = "0.4.0"
borsh = "1.6.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
