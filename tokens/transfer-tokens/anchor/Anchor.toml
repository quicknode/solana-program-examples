[toolchain]
# Match the repo package manager (pnpm-lock.yaml at root); avoids Anchor's yarn default.
package_manager = "pnpm"
solana_version = "3.1.8"

[features]
resolution = true
skip-lint = false

[programs.localnet]
transfer_tokens = "nHi9DdNjuupjQ3c8AJU9sChB5gLbZvTLsJQouY4hU67"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Rust + LiteSVM tests; Metaplex Token Metadata is loaded from a local
# fixture (tests/fixtures/mpl_token_metadata.so), no validator needed.
test = "cargo test"
