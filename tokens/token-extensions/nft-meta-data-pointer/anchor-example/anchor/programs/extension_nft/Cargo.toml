[package]
name = "extension_nft"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "extension_nft"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "2.0.0-rc.1", features = ["compat"] }
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.5", features = ["derive"] }
# anchor-lang 2.0.0-rc.1 is built against wincode 0.5, but solana-address 2.7
# moved to wincode 0.6. With both in the graph, `Address`'s wincode impls
# belong to the version the account derives are not using and every
# `SchemaRead`/`SchemaWrite` bound fails. 2.6.1 is the last 0.5-line release.
solana-address = ">=2.6, <2.7"
anchor-spl = { version = "2.0.0-rc.1" }
# session-keys is Anchor v1 only: its `Session` derive requires
# `Option<Account<'info, SessionToken>>`, which v2 has no equivalent for. The
# account layout is read directly in src/session.rs instead.
# (so it builds against Anchor 1.0). Earlier 2.x releases pin Anchor <=0.30
# and fail to compile against the Anchor 1.0 / Solana 3.x API. Provides the
# gasless session-token lesson via `#[session_auth_or]` / `SessionToken`.
# Token-2022 + token-metadata access goes through anchor-spl's bundled
# re-exports (`anchor_spl::token_interface::spl_token_2022`, which is
# `spl-token-2022-interface`, and `anchor_spl::token_2022_extensions::
# spl_token_metadata_interface`). Pinning standalone `spl-token-2022` /
# `spl-token-metadata-interface` here pulls a second copy on a different
# `solana-pubkey` major than anchor-lang/anchor-spl use, which breaks the
# CPI builders with `Pubkey` type mismatches. Relying on anchor-spl's
# re-exports keeps a single, consistent type universe.

[dev-dependencies]
# Test-side decode of the player account's borsh payload.
borsh = "1.6.1"
litesvm = "0.13.1"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"
solana-instruction = "3.0.0"
solana-pubkey = "3.0.0"
solana-kite = "0.4.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
