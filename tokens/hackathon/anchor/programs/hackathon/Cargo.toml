[package]
name = "hackathon"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hackathon"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.0"
anchor-spl = "1.0.0"
# Hashes the hackathon name into its PDA seed. Onchain this lowers to the
# `sol_sha256` syscall; the `sha2` feature supplies the pure-Rust fallback the
# crate needs when built for the host (tests and the IDL builder), where the
# syscall does not exist. The fallback is target-gated out of the BPF build.
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[dev-dependencies]
litesvm = "0.11.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.0.0"
solana-kite = "0.3.0"
borsh = "1.6.1"
# Tests run on the host, so the `sha2` feature is required for the fallback
# the crate uses off the `sol_sha256` syscall. Used to derive PDA seeds and
# Anchor discriminators for the hand-rolled Squads instructions.
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
