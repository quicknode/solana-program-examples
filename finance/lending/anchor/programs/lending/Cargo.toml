[package]
name = "lending"
version = "0.1.0"
description = "Kamino/Solend-style borrow/lend program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lending"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Forwards to the harness so `anchor test --profile` can turn tracing on.
profile = ["anchor-v2-testing/profile"]

[dependencies]
# init-if-needed: the obligation share vault and the test price feed are created lazily.
anchor-lang = "2.0.0-rc.2"
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.6", features = ["derive"] }
# pinocchio ships only Clock and Rent, so LastRestartSlot is read through
# pinocchio's own `get_sysvar` wrapper (see src/last_restart.rs).
pinocchio = "0.11"
anchor-spl = "2.0.0-rc.2"

[dev-dependencies]
# Anchor v2's own LiteSVM harness. `svm()` is `LiteSVM::new()` until the
# `profile` feature is on, when it also records the SBF register traces that
# `anchor test --profile`, `anchor debugger` and `anchor coverage` read. Tests
# that call `LiteSVM::new()` directly still pass but produce no traces, so
# those three tools see nothing.
#
# Published only from git: crates.io has no `anchor-v2-testing`. Pinned to a
# revision rather than tracking `anchor-next`, so a CI run cannot change
# behaviour because upstream moved between builds.
#
# Bump the rev deliberately, never automatically: `anchor-next` is where v2
# development happens, so a later revision can carry breakage as easily as
# fixes. When `anchor-v2-testing` reaches crates.io, drop the git source for
# an ordinary version.
anchor-v2-testing = { git = "https://github.com/otter-sec/anchor.git", rev = "a20660219882af5f199d56ea3f9326f387f89d8b" }
# LiteSVM 0.18.1 asks for the Agave crates with `^4.3` ranges but does not
# compile against Agave 4.4.0. These two hold the Agave crates at 4.3; the rest
# follow, because Agave pins its own crates to one another exactly. Remove both
# once a LiteSVM release builds against Agave 4.4.
solana-program-runtime = "~4.3"
solana-fee = "~4.3"
solana-kite = "0.7.0"
borsh = "1.6.1"
# Test-side only: LiteSVM's get_sysvar/set_sysvar want the host-side sysvar
# types, not the pinocchio ones anchor-lang exposes on-chain.
solana-sysvar = "3"
solana-clock = "3"
solana-pubkey = "4.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
