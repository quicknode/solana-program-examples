[package]
name = "prop_amm"
version = "0.1.0"
description = "Oracle-quoted proprietary AMM example (Lifinity / SolFi / HumidiFi-style)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "prop_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# init-if-needed: swap creates the trader's destination token account when it
# doesn't exist yet, so a first-time buyer needs no separate setup transaction.
anchor-lang = "2.0.0-rc.1"
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.5", features = ["derive"] }
# `last_restart.rs` reads the LastRestartSlot sysvar through the raw
# `sol_get_sysvar` syscall: pinocchio (and so anchor-lang v2) ships only the
# Clock and Rent sysvars.
solana-define-syscall = "5.0"
# anchor-lang 2.0.0-rc.1 is built against wincode 0.5, but solana-address 2.7
# moved to wincode 0.6. With both in the graph, `Address`'s wincode impls
# belong to the version the account derives are not using and every
# `SchemaRead`/`SchemaWrite` bound fails. 2.6.1 is the last 0.5-line release.
solana-address = ">=2.6, <2.7"
anchor-spl = "2.0.0-rc.1"
# For the LastRestartSlot sysvar (not re-exported by anchor-lang): the oracle
# reader rejects prices from before a cluster restart. Same major as the
# solana-sysvar anchor-lang itself uses, so only one copy is compiled in.
solana-sysvar = "3"
# Declared only so Cargo feature-unification turns on `no-entrypoint`; without
# these the test binary links two `entrypoint` symbols and fails to build.
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.13.1"
solana-clock = "3.0.1"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-kite = "0.4.0"
borsh = "1.6.1"
# The LiteSVM tests load the compiled mock oracle program; depending on the
# crate here lets the tests reuse its instruction-argument types and program ID.
mock_switchboard = { path = "../mock-switchboard", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
