[package]
name = "order_book"
version = "0.1.0"
description = "Order book example (CLOB) on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "order_book"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Forwards to the harness so `anchor test --profile` can turn tracing on.
profile = ["anchor-v2-testing/profile"]

[dependencies]
anchor-lang = { version = "2.0.0-rc.1", features = ["compat"] }
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.5", features = ["derive"] }
# anchor-lang 2.0.0-rc.1 is built against wincode 0.5, but solana-address 2.7
# moved to wincode 0.6. With both in the graph, `Address`'s wincode impls
# belong to the version the account derives are not using and every
# `SchemaRead`/`SchemaWrite` bound fails. 2.6.1 is the last 0.5-line release.
solana-address = ">=2.6, <2.7"
anchor-spl = "2.0.0-rc.1"
# Used by the ported Openbook slab - `bytemuck::Pod` / `Zeroable` on every node
# variant + `min_const_generics` so `[AnyNode; 1024]` can derive Pod without
# hitting bytemuck's default-32 array cap. `static_assertions` keeps the slab
# layout asserts (node size, alignment) compile-time, matching upstream.
bytemuck = { version = "1.18", features = ["derive", "min_const_generics"] }
static_assertions = "1.1"

[dev-dependencies]
# Anchor v2's own LiteSVM harness. `svm()` is `LiteSVM::new()` until the
# `profile` feature is on, when it also records the SBF register traces that
# `anchor test --profile`, `anchor debugger` and `anchor coverage` read. Tests
# that call `LiteSVM::new()` directly still pass but produce no traces, so
# those three tools see nothing.
#
# Published only from git: crates.io has no `anchor-v2-testing`. Pinned to a
# revision rather than tracking `anchor-next`, so a CI run cannot change
# behaviour because upstream moved between builds.
#
# Bump the rev deliberately, never automatically: `anchor-next` is where v2
# development happens, so a later revision can carry breakage as easily as
# fixes. When `anchor-v2-testing` reaches crates.io, drop the git source for
# an ordinary version.
anchor-v2-testing = { git = "https://github.com/otter-sec/anchor.git", rev = "3e38a121b969d1a77230baeb0056baf5cc9b3c1a" }
# Match the test stack used by finance/escrow and the other LiteSVM-based
# Anchor examples so contributors can move between them without version drift.
solana-kite = "0.4.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
