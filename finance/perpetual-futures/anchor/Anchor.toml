[toolchain]
solana_version = "3.1.8"

[features]
resolution = true
skip-lint = false

[programs.localnet]
perpetual_futures = "3uCm8Jep469pHUpYQCh6eA6dpYV3ogvTvaRDZBPtw5So"
mock_switchboard = "FnisQqhF56BxVYh5Wt8xW8wuTVN6STAGnk13MM5SRM7b"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

# Non-default: the LiteSVM Rust tests load both programs' .so files via
# include_bytes!, so they must be built before `cargo test` runs. CI calls
# `anchor build` first; these waits only matter for the legacy validator path.
[test]
startup_wait = 5000
shutdown_wait = 2000
