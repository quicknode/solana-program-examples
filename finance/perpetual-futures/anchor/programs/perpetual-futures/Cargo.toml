[package]
name = "perpetual_futures"
version = "0.1.0"
description = "Oracle-priced, LP-pool perpetual futures example (Jupiter Perps / GMX-style)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "perpetual_futures"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Forwards to the harness so `anchor test --profile` can turn tracing on.
profile = ["anchor-v2-testing/profile"]

[dependencies]
# init-if-needed lets add_liquidity create the provider's liquidity-provider
# token account on their first deposit. The provider is the payer, so this does
# not let one party fund another's rent.
anchor-lang = "2.0.0-rc.2"
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.6", features = ["derive"] }
# `last_restart.rs` reads the LastRestartSlot sysvar through pinocchio's
# `get_sysvar` wrapper: pinocchio (and so anchor-lang v2) ships only the
# Clock and Rent sysvars as typed accessors.
pinocchio = "0.11"
anchor-spl = "2.0.0-rc.2"
# Not used directly. Declared so Cargo feature unification turns on
# `no-entrypoint` for the spl-token that anchor-spl pulls in; without it the
# integration-test binary links two `entrypoint` symbols (this program's and
# spl-token's) and fails.
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
# For the LastRestartSlot sysvar (not re-exported by anchor-lang): the oracle
# reader rejects prices from before a cluster restart. Same major as the
# solana-sysvar anchor-lang itself uses, so only one copy is compiled in.
solana-sysvar = "3"

[dev-dependencies]
# Anchor v2's own LiteSVM harness. `svm()` is `LiteSVM::new()` until the
# `profile` feature is on, when it also records the SBF register traces that
# `anchor test --profile`, `anchor debugger` and `anchor coverage` read. Tests
# that call `LiteSVM::new()` directly still pass but produce no traces, so
# those three tools see nothing.
#
# Published only from git: crates.io has no `anchor-v2-testing`. Pinned to a
# revision rather than tracking `anchor-next`, so a CI run cannot change
# behaviour because upstream moved between builds.
#
# Bump the rev deliberately, never automatically: `anchor-next` is where v2
# development happens, so a later revision can carry breakage as easily as
# fixes. When `anchor-v2-testing` reaches crates.io, drop the git source for
# an ordinary version.
anchor-v2-testing = { git = "https://github.com/otter-sec/anchor.git", rev = "a20660219882af5f199d56ea3f9326f387f89d8b" }
# LiteSVM 0.18.1 asks for the Agave crates with `^4.3` ranges but does not
# compile against Agave 4.4.0. These two hold the Agave crates at 4.3; the rest
# follow, because Agave pins its own crates to one another exactly. Remove both
# once a LiteSVM release builds against Agave 4.4.
solana-program-runtime = "~4.3"
solana-fee = "~4.3"
solana-clock = "3.0.1"
solana-kite = "0.7.0"
borsh = "1.6.1"
# The LiteSVM tests load the compiled mock oracle program; depending on the
# crate here lets the tests reuse its instruction-argument types and program ID.
mock_price_feed = { path = "../mock-price-feed", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
