[package]
name = "options"
version = "0.1.0"
description = "Fully collateralized, physically settled options venue example"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "options"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Forwards to the harness so `anchor test --profile` can turn tracing on.
profile = ["anchor-v2-testing/profile"]

[dependencies]
# init-if-needed: exercise_option and collect_proceeds create the receiving
# party's token account for the asset they are about to be paid in, so a call
# holder who has never held the underlying needs no separate setup transaction.
# The receiving party is always the payer, so nobody funds another's rent.
anchor-lang = "2.0.0-rc.2"
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.6", features = ["derive"] }
anchor-spl = "2.0.0-rc.2"
# Declared only so Cargo feature-unification turns on `no-entrypoint`; without
# these the test binary links two `entrypoint` symbols and fails to build.
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
# Anchor v2's own LiteSVM harness. `svm()` is `LiteSVM::new()` until the
# `profile` feature is on, when it also records the SBF register traces that
# `anchor test --profile`, `anchor debugger` and `anchor coverage` read. Tests
# that call `LiteSVM::new()` directly still pass but produce no traces, so
# those three tools see nothing.
#
# Published only from git: crates.io has no `anchor-v2-testing`. Pinned to a
# revision rather than tracking `anchor-next`, so a CI run cannot change
# behaviour because upstream moved between builds.
#
# Bump the rev deliberately, never automatically: `anchor-next` is where v2
# development happens, so a later revision can carry breakage as easily as
# fixes. When `anchor-v2-testing` reaches crates.io, drop the git source for
# an ordinary version.
anchor-v2-testing = { git = "https://github.com/otter-sec/anchor.git", rev = "a20660219882af5f199d56ea3f9326f387f89d8b" }
# LiteSVM 0.18.1 asks for the Agave crates with `^4.3` ranges but does not
# compile against Agave 4.4.0. These two hold the Agave crates at 4.3; the rest
# follow, because Agave pins its own crates to one another exactly. Remove both
# once a LiteSVM release builds against Agave 4.4.
solana-program-runtime = "~4.3"
solana-fee = "~4.3"
# LiteSVM's `get_sysvar` / `set_sysvar` want the host-side Clock type, not
# pinocchio's on-chain one; the tests move `unix_timestamp` past an expiry.
solana-clock = "3.0.1"
solana-kite = "0.7.0"
# The suite sends each instruction through LiteSVM itself rather than through
# solana-kite's wrapper, so it can read the transaction's metadata back: the
# inner instructions say how many token transfers a handler made. The same
# version anchor-v2-testing pins, so one copy is linked.
litesvm = "0.18.1"
borsh = "1.6.1"
# The suite builds each transaction with solana-kite and sends it through
# LiteSVM itself rather than through solana-kite's sender, so it can read the
# transaction's metadata back: the inner instructions say how many token
# transfers a handler made. This crate names the compute unit limit those
# transactions get; same version solana-kite 0.7 builds against.
solana-compute-budget = "4.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
