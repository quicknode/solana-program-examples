[toolchain]
# Match the repo package manager (pnpm-lock.yaml at root); avoids Anchor's yarn default.
package_manager = "pnpm"
solana_version = "3.1.8"

[features]
resolution = true
skip-lint = false

[programs.localnet]
options = "2gmMGMmipfYypLxWsvQ5GQJT5AGnMWmk4Rb9vQMRo6ig"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

# Non-default: the LiteSVM Rust tests load the program's .so file, so it must
# be built before `cargo test` runs. CI calls `anchor build` first; these waits
# only matter for the legacy validator path.
[test]
startup_wait = 5000
shutdown_wait = 2000
