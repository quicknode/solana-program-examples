[package]
name = "options"
version = "0.1.0"
description = "Fully collateralized, physically settled options venue example"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "options"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# init-if-needed: exercise_option and collect_proceeds create the receiving
# party's token account for the asset they are about to be paid in, so a call
# holder who has never held the underlying needs no separate setup transaction.
# The receiving party is always the payer, so nobody funds another's rent.
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
# Declared only so Cargo feature-unification turns on `no-entrypoint`; without
# these the test binary links two `entrypoint` symbols and fails to build.
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.16.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-kite = "0.6.0"
# The suite builds each transaction with solana-kite and sends it through
# LiteSVM itself rather than through solana-kite's sender, so it can read the
# transaction's metadata back: the inner instructions say how many token
# transfers a handler made. This crate names the compute unit limit those
# transactions get; same version solana-kite 0.6 builds against.
solana-compute-budget = "4.2"
borsh = "1.6.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
