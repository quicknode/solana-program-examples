[package]
name = "mock-swap-router"
version = "0.1.0"
description = "Mock swap router for managed-fund tests"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_swap_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "2.0.0-rc.2"
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.6", features = ["derive"] }
anchor-spl = "2.0.0-rc.2"

[dev-dependencies]
litesvm = "0.18.1"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-kite = "0.7.0"
borsh = "1.6.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
