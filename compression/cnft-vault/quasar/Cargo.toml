[package]
name = "quasar-cnft-vault"
version = "0.1.0"
edition = "2021"

# Standalone workspace - not part of the root program-examples workspace.
# Quasar uses a different resolver and dependency tree.
[workspace]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
]

[lib]
crate-type = ["cdylib", "lib"]

[features]
alloc = []
client = []
debug = []

[dependencies]
quasar-lang = { git = "https://github.com/blueshift-gg/quasar" }
# Direct dependency for invoke_signed_with_bounds - needed for raw CPI with
# variable proof accounts. quasar-lang re-exports types but not the invoke fns.
solana-instruction-view = { version = "2", features = ["cpi"] }
solana-instruction = { version = "3.2.0" }

[dev-dependencies]
quasar-svm = { git = "https://github.com/blueshift-gg/quasar-svm" }
solana-address = { version = "2.2.0", features = ["decode"] }
# Generated by `quasar build` (see [clients] in Quasar.toml); gives tests
# typed *Instruction builders instead of hand-built account metas.
quasar-cnft-vault-client = { path = "target/client/rust/quasar-cnft-vault-client" }
# Tests mirror Bubblegum's borsh metadata layout and keccak leaf hashing to
# recompute data_hash / creator_hash, same as the Anchor twin's suite.
borsh = { version = "1", features = ["derive"] }
solana-keccak-hasher = "3"
