[package]
name = "cutils"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cutils"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
# mpl-bubblegum and spl-account-compression removed: they depend on solana-program 2.x
# which is incompatible with Anchor 1.0's solana 3.x types. CPI calls are built manually
# using raw invoke() with hardcoded program IDs and discriminators. Bubblegum types
# (MetadataArgs, LeafSchema, etc.) are re-implemented in bubblegum_types.rs.
borsh = "1"
sha3 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "0.16.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "3.0.0"
solana-account = "4.3.0"
solana-native-token = "3.0.0"
solana-signer = "3.0.0"
# Builds each v1 transaction the tests send. They send it through LiteSVM
# themselves to read the program error a failure carries.
solana-kite = "0.6.0"
# TODO: delete these two once solana-kite turns on `no-entrypoint` for them
# itself. kite 0.6.0 builds both with their program entrypoints, which clash
# with this program's `entrypoint` symbol when the test binary links (anchor's
# IDL build failed with `duplicate symbol: entrypoint`). Naming the same
# versions here turns the feature on through Cargo's feature unification.
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
# The named limit those transactions get. Same version solana-kite 0.6 builds
# against.
solana-compute-budget = "4.2"
solana-keccak-hasher = "3.0.0"
