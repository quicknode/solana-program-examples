[package]
name = "cnft-burn"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cnft_burn"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "2.0.0-rc.1", features = ["compat"] }
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.5", features = ["derive"] }
# anchor-lang 2.0.0-rc.1 is built against wincode 0.5, but solana-address 2.7
# moved to wincode 0.6. With both in the graph, `Address`'s wincode impls
# belong to the version the account derives are not using and every
# `SchemaRead`/`SchemaWrite` bound fails. 2.6.1 is the last 0.5-line release.
# `borsh` adds the BorshSerialize/BorshDeserialize impls for `Address` that the
# vendored Bubblegum types need; pinocchio re-exports this same type.
solana-address = { version = ">=2.6, <2.7", features = ["borsh"] }
# mpl-bubblegum and spl-account-compression removed: they depend on solana-program 2.x
# which is incompatible with Anchor 1.0's solana 3.x types. CPI calls are built manually
# using raw invoke() with hardcoded program IDs and discriminators.
borsh = { version = "1", features = ["derive"] }

[dev-dependencies]
litesvm = "0.13.1"
solana-kite = "0.4.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "3.0.0"
solana-transaction = "3.0.0"
solana-account = "3.0.0"
solana-native-token = "3.0.0"
solana-signer = "3.0.0"
solana-message = "3.0.0"
solana-keccak-hasher = "3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
