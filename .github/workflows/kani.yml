name: Kani

# Formal-verification proofs (https://github.com/model-checking/kani).
#
# These harnesses model a program's pure arithmetic / value-conservation logic
# and let the Kani model checker prove the invariants exhaustively, in the
# spirit of aeyakovenko/percolator.
#
# Scope: currently the escrow proofs only. The escrow harnesses are linear /
# fixed-width and verify in seconds, which keeps CI fast and reliable. The
# token-swap (AMM) proofs additionally exist under
# finance/token-swap/kani-proofs, but they verify nonlinear 128-bit arithmetic
# (constant-product curve, integer sqrt) and need bounded inputs to stay
# tractable; they are intentionally NOT wired into CI yet.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Quick sanity check: the proof crate also compiles and its plain unit tests
  # pass on stable, independently of the Kani toolchain. Fast feedback if the
  # models themselves regress.
  unit-tests:
    name: Escrow proof unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        working-directory: finance/escrow/kani-proofs
        run: cargo test

  # The formal verification itself. The official Kani action installs the
  # verifier + CBMC toolchain (with caching) and runs `cargo kani` in the proof
  # crate. Any failed proof fails the job.
  verify:
    name: Escrow Kani proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Kani
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: finance/escrow/kani-proofs
