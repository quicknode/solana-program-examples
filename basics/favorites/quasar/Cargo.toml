[package]
name = "quasar-favorites"
version = "0.1.0"
edition = "2021"

# Standalone workspace - not part of the root program-examples workspace.
[workspace]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
]

[lib]
# "lib" is required alongside "cdylib": the 0.1.0 IDL build compiles the
# crate as a host library.
crate-type = ["cdylib", "lib"]

[features]
alloc = []
client = []
debug = []
idl-build = ["quasar-lang/idl-build"]

[dependencies]
# Quasar 0.1.0-release, pinned by rev: crates.io still hosts 0.0.0
# placeholders for quasar-lang/quasar-cli, so the release line installs from
# git. Keep this rev in lockstep with the CLI rev installed by
# .github/workflows/quasar.yml.
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", rev = "be60fca" }
solana-instruction = { version = "3.2.0" }

[dev-dependencies]
quasar-test = { git = "https://github.com/blueshift-gg/quasar", rev = "be60fca" }
