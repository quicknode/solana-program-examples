[package]
name = "hello-solana-anchor"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hello_solana"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"

[dev-dependencies]
litesvm = "0.16.0"
solana-signer = "3.0.0"
solana-kite = "0.6.0"
# The named limit for the one transaction the test builds itself. Same version
# solana-kite 0.6 builds against.
solana-compute-budget = "4.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
