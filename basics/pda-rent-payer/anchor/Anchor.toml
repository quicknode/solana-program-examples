package_manager = "pnpm"
solana_version = "3.1.8"

[features]
seeds = false
[programs.localnet]
pda_rent_payer = "7Hm9nsYVuBZ9rf8z9AMUHreZRv8Q4vLhqwdVTCawRZtA"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
