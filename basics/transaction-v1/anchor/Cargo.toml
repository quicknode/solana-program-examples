# This workspace is deliberately absent from the repository root `Cargo.toml`
# members list, unlike every other `anchor/` example.
#
# The root workspace pins LiteSVM 0.13.1 through `anchor-v2-testing` and
# `solana-kite`, and 0.13.1 predates transaction v1. LiteSVM 0.16.0 is the first
# release that executes v1 transactions, and the two cannot share a lockfile:
# each pins a different `solana-instruction` 3.x patch release. Until the root
# workspace moves to LiteSVM 0.16+, this example resolves on its own, and the
# Anchor v2 workflow (not the root `cargo clippy`) is what keeps it honest.
[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
