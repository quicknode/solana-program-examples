[toolchain]
# Match the repo package manager (pnpm-lock.yaml at root); avoids Anchor's yarn default.
package_manager = "pnpm"
solana_version = "3.1.8"

[features]
seeds = false
skip-lint = false

[programs.localnet]
transaction_v1_anchor_program = "F1dMqenFVwcp3SmX9Sq9e22nmcxcact5No12pmb5rL5F"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
