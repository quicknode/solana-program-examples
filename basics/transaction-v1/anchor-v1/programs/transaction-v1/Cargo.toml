[package]
name = "transaction-v1-anchor-program"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transaction_v1_anchor_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.1"

[dev-dependencies]
# LiteSVM has understood v1 transactions since 0.16.0 - it reads the compute
# unit limit, priority fee, loaded-accounts data size limit and heap size from
# the message's transaction config rather than from ComputeBudget instructions.
#
# The other Anchor v1 examples send v1 transactions through solana-kite 0.7.
# This example builds its own, to show each config field.
litesvm = "0.18.2"
borsh = "1.6.1"
solana-keypair = "3.0.1"
# `solana_message::v1` (the v1 message, `TransactionConfig` and the 4,096
# byte `MAX_TRANSACTION_SIZE`) first shipped in solana-message 4.2.
solana-message = "4.5"
solana-native-token = "3.0"
# `PACKET_DATA_SIZE`, the 1,232 byte limit legacy and v0 transactions keep.
solana-packet = "4.2"
solana-transaction = "4.2"
solana-transaction-error = "3.4"
# The SDK's serializer. `wincode::serialize` on a `VersionedTransaction` gives
# the exact bytes that would go over the wire, which is how the tests measure
# transaction size.
#
# The major must match the one solana-transaction serializes with, which
# LiteSVM 0.18.2 resolves to 0.6: wincode 0.5 and 0.6 are separate crates to
# the compiler, so `VersionedTransaction` implements 0.6's `SchemaWrite` and
# not 0.5's, and calling 0.5's `serialize` on it does not compile.
wincode = "0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
