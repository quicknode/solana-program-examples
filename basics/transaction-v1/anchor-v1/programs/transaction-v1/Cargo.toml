[package]
name = "transaction-v1-anchor-program"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transaction_v1_anchor_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"

[dev-dependencies]
# 0.16.0 is the first LiteSVM that understands v1 transactions: it reads the
# compute unit limit, priority fee, loaded-accounts data size limit and heap
# size from the message's transaction config rather than from ComputeBudget
# instructions.
#
# The other Anchor v1 examples build their transactions with `solana-kite`,
# whose `send_transaction_from_instructions` builds a legacy transaction.
# This example builds its v1 transactions by hand instead.
litesvm = "0.16.0"
borsh = "1.6.1"
solana-keypair = "3.1"
# `solana_message::v1` (the v1 message, `TransactionConfig` and the 4,096
# byte `MAX_TRANSACTION_SIZE`) first shipped in solana-message 4.2.
solana-message = "4.2"
solana-native-token = "3.0"
# `PACKET_DATA_SIZE`, the 1,232 byte limit legacy and v0 transactions keep.
solana-packet = "4.2"
solana-transaction = "4.1"
solana-transaction-error = "3.3"
# The SDK's serializer. `wincode::serialize` on a `VersionedTransaction` gives
# the exact bytes that would go over the wire, which is how the tests measure
# transaction size.
wincode = "0.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
