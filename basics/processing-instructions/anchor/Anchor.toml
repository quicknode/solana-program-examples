package_manager = "pnpm"
solana_version = "3.1.8"

[features]
seeds = false
[programs.localnet]
processing_instructions = "DgoL5J44aspizyUs9fcnpGEUJjWTLJRCfx8eYtUMYczf"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
