[package]
name = "close-account-program"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "close_account_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "2.0.0-rc.1"
# The `#[program]` macro expands to `wincode` paths for instruction-data
# (de)serialization, so the crate has to be a direct dependency.
wincode = { version = "0.5", features = ["derive"] }
# anchor-lang 2.0.0-rc.1 is built against wincode 0.5, but solana-address 2.7
# moved to wincode 0.6. Both end up in the graph, and `Address`'s wincode impls
# then belong to the version the `#[account(borsh)]` derive is not using, so an
# `Address` field fails to satisfy `SchemaRead`/`SchemaWrite`. 2.6.1 is the last
# release on the 0.5 line.
solana-address = ">=2.6, <2.7"

[dev-dependencies]
litesvm = "0.13.1"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-kite = "0.4.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
