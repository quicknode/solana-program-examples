# Wrapper crate for the Codama-generated client in src/generated/.
# Regenerate the contents of src/generated/ with `pnpm generate-client`;
# this manifest and src/lib.rs are hand-written and stay put.
[package]
name = "car-rental-service-client"
version = "0.1.0"
edition = "2021"

# Standalone, like the program crate: this example is intentionally not part
# of the repository root workspace.
[workspace]

[lib]
name = "car_rental_service_client"

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
solana-account-info = "3.0"
solana-cpi = "3.0"
solana-instruction = "3.0"
solana-program-error = "3.0"
# borsh feature: the generated Car/RentalOrder account structs borsh-derive
# over Pubkey fields.
solana-pubkey = { version = "3.0", features = ["borsh"] }

[features]
# The generated code also supports "fetch" (RPC account fetching via
# solana-client) and "anchor" (anchor-lang trait impls); neither is needed by
# the LiteSVM tests, so their optional dependencies are not declared here.
default = []
