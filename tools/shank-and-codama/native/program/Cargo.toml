[package]
name = "car-rental-service"
version = "0.1.0"
edition = "2021"

[dependencies]
borsh = "1.5.7"
borsh-derive = "1.5.7"
shank = "0.4.8"
solana-program = "4.0"
solana-system-interface = { version = "3", features = ["bincode"] }

[dev-dependencies]
car-rental-service-client = { path = "../clients/rust" }
litesvm = "0.18.2"
# Host-side SDK crates, on the majors LiteSVM 0.18.2 itself uses. They are not
# interchangeable across majors: `svm.set_account` takes the `Account` from
# solana-account 4.x, and a 3.x `Account` is a different type to the compiler.
# `Transaction::new_signed_with_payer` needs solana-transaction 4.x, where it
# sits behind the `wincode` feature that solana-transaction enables for its own
# serializer.
solana-account = "4.3.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "4.3"
solana-transaction = "4.2"

# This example is intentionally standalone (not part of the root workspace),
# so it pins its own dependency versions and has its own Cargo.lock.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
