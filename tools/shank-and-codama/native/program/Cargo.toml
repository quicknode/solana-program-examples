[package]
name = "car-rental-service"
version = "0.1.0"
edition = "2021"

[dependencies]
borsh = "1.5.7"
borsh-derive = "1.5.7"
shank = "0.4.8"
solana-program = "4.0"
solana-system-interface = { version = "3", features = ["bincode"] }

# This example is intentionally standalone (not part of the root workspace),
# so it pins its own dependency versions and has its own Cargo.lock.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
